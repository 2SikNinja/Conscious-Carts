<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Root base path so deep links like /food/123 load assets correctly. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Search, scan, and compare grocery products with AI nutrition analysis tailored to your allergies and diet.">
  <meta name="theme-color" content="#6B7F2A">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Conscious Cart">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Conscious Cart</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body { margin: 0; background: #FCFAF0; }
    @media (prefers-color-scheme: dark) { body { background: #15190F; } }
    #splash {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      transition: opacity 0.3s ease;
    }
    #splash img { width: 112px; height: 112px; border-radius: 50%; animation: pulse 1.4s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Loading Conscious Cart"></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.style.opacity = '0';
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
